<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->
<meta charset="utf-8">
<title>feedme — 프로토타입</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── project tokens: copied verbatim from app/globals.css ── */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --radius: 0.625rem;
    /* Inter (next/font, network) → system stack substitution */
    --font: Inter, ui-sans-serif, system-ui, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;
  }
  :root.sh-theme-dark, body.sh-theme-dark {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --card-foreground: oklch(0.985 0 0);
    --popover: oklch(0.205 0 0);
    --popover-foreground: oklch(0.985 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
  }

  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background, #f6f6f6); color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-theme { display: inline-flex; border: 1px solid #3a3d42; border-radius: 99px; overflow: hidden }
  .sh-theme button { border: 0; border-radius: 0; padding: 2px 10px }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }
  .sh-theme-dark .wf-pic { background: repeating-linear-gradient(45deg,
             color-mix(in srgb, var(--foreground) 16%, transparent) 0 6px,
             color-mix(in srgb, var(--foreground) 8%, transparent) 6px 12px) }

  /* ── product styles (shadcn base-vega look, via tokens) ── */
  .app { position: relative; min-height: 70vh; font-size: 14px; line-height: 1.5; word-break: keep-all }
  .app-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 12px; border-bottom: 1px solid var(--border) }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em }
  .brand-mark { width: 24px; height: 24px; border-radius: calc(var(--radius) * 0.6); background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; font: 600 12px var(--font-mono) }
  .container { max-width: 720px; margin: 0 auto; padding: 32px 0 24px; display: flex; flex-direction: column; gap: 24px }
  .sh-vp-390 .container { padding-top: 20px; gap: 20px }

  h1.hero { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; text-wrap: balance }
  .sh-vp-390 h1.hero { font-size: 22px }
  .lead { margin: 6px 0 0; color: var(--muted-foreground); font-size: 15px }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: calc(var(--radius) * 0.8); border: 1px solid transparent; font: 500 14px var(--font); cursor: pointer; white-space: nowrap; background: var(--primary); color: var(--primary-foreground); transition: opacity .15s, background .15s }
  .btn:hover { opacity: .9 }
  .btn:focus-visible, .input:focus-visible, .chip:focus-visible { outline: 3px solid color-mix(in srgb, var(--ring) 50%, transparent); outline-offset: 0 }
  .btn[disabled] { opacity: .5; pointer-events: none }
  .btn.outline { background: var(--background); color: var(--foreground); border-color: var(--border); box-shadow: 0 1px 2px rgb(0 0 0 / .04) }
  .btn.outline:hover { background: var(--accent); opacity: 1 }
  .btn.ghost { background: transparent; color: var(--foreground) }
  .btn.ghost:hover { background: var(--accent); opacity: 1 }
  .btn.icon { width: 36px; padding: 0 }
  .btn.sm { height: 32px; padding: 0 10px; font-size: 13px }
  .btn.icon.sm { width: 28px; height: 28px }
  .btn svg { width: 16px; height: 16px; flex: none }

  .field { display: flex; flex-direction: column; gap: 6px }
  .url-row { display: flex; gap: 8px }
  .input-group { position: relative; flex: 1; min-width: 0 }
  .input { width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--input); border-radius: calc(var(--radius) * 0.8); background: transparent; color: var(--foreground); font: 14px var(--font); box-shadow: 0 1px 2px rgb(0 0 0 / .04) }
  .input-group .input { padding-left: 34px; padding-right: 38px }
  .input-group .lead-icon { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--muted-foreground) }
  .input-group .clear { position: absolute; right: 4px; top: 4px }
  .input::placeholder { color: var(--muted-foreground) }
  .input[aria-invalid="true"] { border-color: var(--destructive); outline: 3px solid color-mix(in srgb, var(--destructive) 20%, transparent) }
  .field-error { color: var(--destructive); font-size: 13px; margin: 0 }
  .field-desc { color: var(--muted-foreground); font-size: 13px; margin: 0 }
  .sh-vp-390 .url-row { flex-direction: column }
  .sh-vp-390 .url-row > .btn { width: 100% }

  .alert { display: grid; grid-template-columns: 16px 1fr; gap: 2px 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card) }
  .alert svg { width: 16px; height: 16px; margin-top: 2px }
  .alert.destructive { color: var(--destructive) }
  .alert-title { font-weight: 500 }
  .alert-desc { grid-column: 2; color: var(--muted-foreground); font-size: 13px }
  .alert.destructive .alert-desc { color: color-mix(in srgb, var(--destructive) 85%, var(--foreground)) }

  .card { border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.4); background: var(--card); color: var(--card-foreground); overflow: hidden }
  .card-header { padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 6px }
  .card-title { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; text-wrap: pretty }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--muted-foreground); font-size: 13px }
  .meta .dot { width: 3px; height: 3px; border-radius: 99px; background: currentColor; opacity: .6 }
  .meta a { color: inherit; text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere }
  .meta .author { color: var(--foreground); font-weight: 500 }
  .sep { height: 1px; background: var(--border); border: 0; margin: 0 }

  .export { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; background: color-mix(in srgb, var(--muted) 50%, transparent) }
  .export-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
  .export-label { font-size: 13px; font-weight: 500; margin: 0 0 8px }
  .chips { display: flex; flex-wrap: wrap; gap: 6px }
  .chip { height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); font: 13px var(--font); cursor: pointer }
  .chip:hover { background: var(--accent) }
  .chip[aria-checked="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary) }
  .custom-prompt { margin-top: 8px }
  .send-row { display: flex; gap: 8px; flex-wrap: wrap }
  .sh-vp-390 .send-row .btn, .sh-vp-390 .export-row .btn { flex: 1 }
  .split { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap }

  .prose { padding: 20px 20px 28px; font-size: 15px; line-height: 1.7; overflow-wrap: break-word }
  .prose > :first-child { margin-top: 0 }
  .prose h2 { font-size: 18px; margin: 28px 0 8px; letter-spacing: -0.01em; line-height: 1.35 }
  .prose h3 { font-size: 16px; margin: 22px 0 6px }
  .prose p { margin: 0 0 14px }
  .prose ul, .prose ol { margin: 0 0 14px; padding-left: 22px }
  .prose li { margin: 4px 0 }
  .prose a { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--foreground) 35%, transparent) }
  .prose blockquote { margin: 0 0 14px; padding: 2px 0 2px 14px; border-left: 3px solid var(--border); color: var(--muted-foreground) }
  .prose code { font: 0.88em var(--font-mono); background: var(--muted); padding: 1px 5px; border-radius: 4px }
  .prose pre { background: var(--muted); padding: 12px 14px; border-radius: var(--radius); overflow-x: auto; margin: 0 0 14px; font-size: 13px; line-height: 1.55 }
  .prose pre code { background: none; padding: 0 }
  .prose .table-wrap { overflow-x: auto; margin: 0 0 14px }
  .prose table { border-collapse: collapse; width: 100%; font-size: 14px }
  .prose th, .prose td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top }
  .prose th { background: var(--muted); font-weight: 600 }
  .prose img, .prose .wf-pic { display: block; width: 100%; height: 200px; margin: 0 0 14px }
  .prose sup a { text-decoration: none; font-size: 11px }

  .skeleton { background: var(--muted); border-radius: calc(var(--radius) * 0.6); animation: pulse 1.6s ease-in-out infinite }
  @keyframes pulse { 50% { opacity: .5 } }
  .skel-stack { padding: 20px; display: flex; flex-direction: column; gap: 10px }

  .empty { border: 1px dashed var(--border); border-radius: calc(var(--radius) * 1.4); padding: 36px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px }
  .empty-icon { width: 40px; height: 40px; border-radius: var(--radius); background: var(--muted); display: grid; place-items: center }
  .empty-icon svg { width: 20px; height: 20px }
  .empty-title { font-weight: 500; font-size: 15px }
  .empty-desc { color: var(--muted-foreground); font-size: 13px; max-width: 360px }
  .examples { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 6px }

  /* start screen: search-engine style, centered */
  .home-logo, .home-actions { display: none }
  .app.home .app-header { border-bottom-color: transparent }
  .app.home .app-header .brand { visibility: hidden }
  .app.home .container { min-height: 62vh; justify-content: center; align-items: center; text-align: center; padding-bottom: 12vh }
  .app.home .hero-block { display: none }
  .app.home .home-logo { display: block; margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -0.05em; line-height: 1 }
  .app.home .home-logo + .lead { margin-top: 12px }
  .sh-vp-390 .app.home .home-logo { font-size: 48px }
  .app.home .field { width: 100%; max-width: 584px; align-items: center }
  .app.home .url-row { width: 100% }
  .app.home .url-row > #convertBtn { display: none }
  .app.home .input-group .input { height: 48px; border-radius: 99px; padding-left: 46px; padding-right: 48px; font-size: 16px; box-shadow: none; border-color: var(--border) }
  .app.home .input-group .input:hover, .app.home .input-group .input:focus { box-shadow: 0 1px 6px color-mix(in srgb, var(--foreground) 18%, transparent); border-color: transparent; outline: none }
  .app.home .input-group .input[aria-invalid="true"] { border-color: var(--destructive) }
  .app.home .input-group .lead-icon { left: 18px; width: 18px; height: 18px }
  .app.home .input-group .clear { top: 10px; right: 10px }
  .app.home .home-actions { display: flex; justify-content: center; gap: 12px; margin-top: 22px }
  .btn.secondary { background: var(--muted); color: var(--foreground); border-color: var(--muted) }
  .btn.secondary:hover { border-color: var(--border); opacity: 1 }
  .home-examples { color: var(--muted-foreground); font-size: 13px }
  .home-examples a { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--foreground) 30%, transparent); cursor: pointer }

  .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 99px; animation: spin .7s linear infinite }
  @keyframes spin { to { rotate: 360deg } }

  /* Sonner-style toasts, pinned inside the stage */
  .toaster { position: sticky; bottom: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; height: 0; overflow: visible; z-index: 50 }
  .toaster-inner { position: absolute; bottom: 0; right: 0; display: flex; flex-direction: column; gap: 8px; width: min(360px, 100%) }
  .toast { pointer-events: auto; display: grid; grid-template-columns: 18px 1fr; gap: 2px 10px; padding: 12px 14px; border-radius: var(--radius); background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); box-shadow: 0 8px 24px rgb(0 0 0 / .12); font-size: 13px; animation: in .2s ease-out }
  .toast svg { width: 16px; height: 16px; margin-top: 2px }
  .toast-title { font-weight: 500 }
  .toast-desc { grid-column: 2; color: var(--muted-foreground) }
  .toast kbd { font: 11px var(--font-mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--muted) }
  @keyframes in { from { opacity: 0; translate: 0 6px } }
</style>

<header class="sh-bar">
  <b>proto</b>
  <label class="sh-control"><span class="sh-control-label">screen</span><select id="sh-screen"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
  <div class="sh-theme" id="sh-theme" role="group" aria-label="theme (t)" hidden>
    <button data-theme="light">light</button><button data-theme="dark">dark</button>
  </div>
</header>

<main class="sh-stage">
  <section data-screen="home" data-title="변환" data-states="변환 결과,긴 문서 결과,저자 없음,접근 실패,본문 없음" class="app home">
    <header class="app-header" data-component="new:AppHeader">
      <div class="brand"><span class="brand-mark">fm</span>feedme</div>
      <button class="btn ghost icon" id="themeToggle" data-component="Button" aria-label="다크 모드로 전환" title="다크 모드로 전환">
        <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg id="icoSun" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </header>

    <div class="container">
      <div class="home-intro">
        <h1 class="home-logo" data-component="new:Wordmark">feedme</h1>
        <p class="lead">웹 페이지를 Markdown으로, 바로 LLM에게</p>
      </div>

      <form class="field" id="urlForm" data-component="Field" novalidate>
        <div class="url-row">
          <div class="input-group" data-component="InputGroup">
            <svg class="lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <input class="input" id="url" data-component="Input" type="url" inputmode="url" autocomplete="off" placeholder="https://example.com/article" aria-label="웹 페이지 URL" aria-describedby="urlError">
            <button type="button" class="btn ghost icon sm clear" id="clearBtn" data-component="InputGroupButton" aria-label="지우기" title="지우기" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <button class="btn" id="convertBtn" data-component="Button" type="submit">변환하기</button>
        </div>
        <p class="field-error" id="urlError" data-component="FieldError" hidden>http:// 또는 https://로 시작하는 웹 페이지 주소를 입력해 주세요.</p>
        <div class="home-actions">
          <button class="btn secondary" type="submit" data-component="Button">Markdown으로 변환</button>
          <button class="btn secondary" type="button" data-example="https://ko.wikipedia.org/wiki/마크다운" data-component="Button">예시로 해보기</button>
        </div>
      </form>

      <!-- error alert -->
      <div class="alert destructive" id="errorAlert" role="alert" data-component="Alert" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <div class="alert-title" id="errorTitle"></div>
        <div class="alert-desc" id="errorDesc"></div>
      </div>

      <!-- empty -->
      <p class="home-examples" id="emptyState">

<h2>변경 사항</h2>
<ul><li>사이드바 접기 단축키가 <code>Ctrl</code> + <code>\\</code>에서 <code>Ctrl</code> + <code>B</code>로 바뀌었습니다.</li><li>첨부 파일 최대 크기가 25MB에서 100MB로 늘었습니다.</li></ul>
<h2>고친 문제</h2>
<ul><li>표 안에서 한글을 입력할 때 마지막 글자가 사라지던 문제</li><li>다크 모드에서 코드 블록 배경이 흰색으로 보이던 문제</li></ul>`

  const URL_LIMIT = 6000; // assumed safe ?q= length (chars)

  const $ = id => document.getElementById(id);
  const urlInput = $('url'), clearBtn = $('clearBtn'), convertBtn = $('convertBtn');
  let doc = null, timer = null;

  function view(which) {
    $('emptyState').hidden = which !== 'empty';
    $('loadingCard').hidden = which !== 'loading';
    $('resultCard').hidden = which !== 'result';
    $('errorAlert').hidden = which !== 'error';
    document.querySelector('.app').classList.toggle('home', which === 'empty');
    document.querySelector('.home-intro').hidden = which !== 'empty';

  function setLoading(on) {
    convertBtn.disabled = on; urlInput.readOnly = on;
    convertBtn.innerHTML = on ? '<span class="spinner"></span>변환 중…' : '변환하기';
  }
  function syncClear() { clearBtn.hidden = !urlInput.value; }

  function renderDoc(d) {
    doc = d;
    $('rTitle').textContent = d.title;
    const byline = d.author || d.site || d.domain;
    const parts = [`<span class="author">${byline}</span>`];
    if (d.author && d.site) parts.push(`<span>${d.site}</span>`);
    if (d.published) parts.push(`<span>${d.published}</span>`);
    parts.push(`<a href="#" onclick="return false">${d.domain}</a>`);
    parts.push(`<span>${d.chars.toLocaleString('ko-KR')}자</span>`);
    $('rMeta').innerHTML = parts.join('<span class="dot"></span>');
    $('rBody').innerHTML = d.html;
    view('result');

  function showError(title, desc) {
    doc = null;
    $('errorTitle').textContent = title; $('errorDesc').textContent = desc;
    view('error');

  const ERRORS = {
    fetch: ['페이지를 불러오지 못했어요', '주소가 맞는지, 로그인 없이 열리는 공개 페이지인지 확인해 주세요. (응답 없음 또는 404)'],

  };

  function pickDoc(u) {
    if (/wiki/i.test(u)) return 'wiki';
    if (/notely|release/i.test(u)) return 'noauthor';
    if (/404|nope|없는/i.test(u)) return 'fetch';
    if (/login|app\.|dashboard/i.test(u)) return 'empty';
    return 'blog';

  function resetPrompt() {
    $('chips').querySelectorAll('.chip').forEach((c, i) => c.setAttribute('aria-checked', i === 0));
    $('customPrompt').value = ''; $('customPrompt').hidden = true;
  }

  $('urlForm').onsubmit = e => {
    e.preventDefault();
    const v = urlInput.value.trim();
    const ok = /^https?:\/\/[^\s.]+\.[^\s]+$/i.test(v);
    urlInput.setAttribute('aria-invalid', !ok);
    $('urlError').hidden = ok;
    if (!ok) { urlInput.focus(); return; }
    prototypeShell.setState('Default');
    resetPrompt();
    setLoading(true); view('loading');
    clearTimeout(timer);
    timer = setTimeout(() => {
      setLoading(false);
      const k = pickDoc(v);
      if (k === 'fetch' || k === 'empty') return showError(...ERRORS[k]);
      renderDoc(DOCS[k]);
    }, 1100);
  };
  urlInput.oninput = () => { syncClear(); if (urlInput.getAttribute('aria-invalid') === 'true') { urlInput.setAttribute('aria-invalid', false); $('urlError').hidden = true; } };

  function clearAll() {
    clearTimeout(timer); setLoading(false);
    urlInput.value = ''; syncClear();
    urlInput.setAttribute('aria-invalid', false); $('urlError').hidden = true;
    resetPrompt(); doc = null; view('empty');
    prototypeShell.setState('Default');

  clearBtn.onclick = clearAll;

  function currentPrompt() {
    const c = $('chips').querySelector('[aria-checked="true"]');
    if (!c) return '';
    return c.dataset.prompt === '__custom' ? $('customPrompt').value.trim() : c.dataset.prompt;
  }

  /* toasts */
  const ICONS = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>',

  };
  function toast(title, desc, icon = 'ok', ms = 3200) {
    const t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status');
    t.innerHTML = ICONS[icon] + `<div class="toast-title">${title}</div>` + (desc ? `<div class="toast-desc">${desc}</div>` : '');
    $('toaster').append(t);
    setTimeout(() => t.remove(), ms);
  }

  $('copyBtn').onclick = () => toast('Markdown을 복사했어요', `${doc.chars.toLocaleString('ko-KR')}자`);
  $('downloadBtn').onclick = () => toast('파일을 저장했어요', doc.file);
  function openIn(name) {
    const p = currentPrompt();
    const total = (p ? p.length + 2 : 0) + doc.chars;
    const what = p ? `“${p}” + 본문` : '본문';
    if (total <= URL_LIMIT) {
      toast(`${name} 새 탭을 열었어요`, `${what}이 입력창에 채워져 있어요.`);
    } else {
      toast(`글이 길어서 클립보드에 복사했어요`, `${name} 새 대화에서 <kbd>Ctrl</kbd>+<kbd>V</kbd>로 붙여넣으세요. (${what}, ${total.toLocaleString('ko-KR')}자)`, 'info', 7000);
    }
  }

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  /* product preset entry: forced data/errors */
  const PRESETS = {
    '변환 결과': () => { urlInput.value = DOCS.blog.url; renderDoc(DOCS.blog); },
    '긴 문서 결과': () => { urlInput.value = DOCS.wiki.url; renderDoc(DOCS.wiki); },
    '저자 없음': () => { urlInput.value = DOCS.noauthor.url; renderDoc(DOCS.noauthor); },
    '접근 실패': () => { urlInput.value = 'https://haneul.blog/posts/404-old-post'; showError(...ERRORS.fetch); },
    '본문 없음': () => { urlInput.value = 'https://app.notely.app/dashboard'; showError(...ERRORS.empty); },
    'Default': () => { urlInput.value = ''; view('empty'); doc = null; }
  };
  stateSelect.onchange = () => {
    const name = stateSelect.value;
    clearTimeout(timer); setLoading(false); resetPrompt();
    urlInput.setAttribute('aria-invalid', false); $('urlError').hidden = true;
    (PRESETS[name] || PRESETS.Default)(); syncClear();
    applyState(name);
  };

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
    /* product toggle mirrors the theme */
    document.getElementById('icoMoon').hidden = dark;
    document.getElementById('icoSun').hidden = !dark;
    const label = dark ? '라이트 모드로 전환' : '다크 모드로 전환';
    const tt = document.getElementById('themeToggle');
    tt.setAttribute('aria-label', label); tt.title = label;
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  document.getElementById('themeToggle').onclick = () => { dark = !dark; applyTheme(); };
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
